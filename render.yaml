services:
  - type: web
    name: sispm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask seed --full && gunicorn --config gunicorn.conf.py wsgi:app
    envVars:
      - key: FLASK_APP
        value: app
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sispm-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.11

  - type: pgsql
    name: sispm-db
    plan: free
