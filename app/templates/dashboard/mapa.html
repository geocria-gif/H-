{% extends 'base.html' %}

{% block title %}Mapa CPR-CN - Dashboard - SISPM{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0"><i class="bi bi-map me-2"></i>Mapa de Ocorrências CPR-CN</h1>
            <small class="text-muted">Clique nos marcadores para detalhes | Áreas coloridas por OPM</small>
        </div>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Voltar ao Dashboard
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div id="mapa-cpr" style="height:600px"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    CprMap.init({
        mapId: 'mapa-cpr',
        municipios: {{ municipios_json|tojson }},
        ocorrencias: {{ ocorrencias_json|tojson }}
    });
});
</script>
{% endblock %}
