{% extends 'base.html' %}

{% block title %}Logs do Sistema - SISPM{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-file-earmark-text me-2"></i>Logs do Sistema</h1>
    </div>

    {% for filename, lines in logs.items() %}
    <div class="card mb-3">
        <div class="card-header p-0">
            <h2 class="h5 mb-0">
                <button class="btn btn-link text-decoration-none w-100 text-start px-3 py-2 d-flex justify-content-between align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#log-{{ loop.index }}">
                    <span>
                        <i class="bi bi-file-earmark-text me-2"></i>{{ filename }}
                    </span>
                    <span class="badge bg-secondary">{{ lines|length }} linhas</span>
                </button>
            </h2>
        </div>
        <div id="log-{{ loop.index }}" class="collapse {% if loop.first %}show{% endif %}">
            <div class="card-body p-0">
                <pre class="mb-0 px-3 py-3 bg-dark text-light" style="max-height: 400px; overflow-y: auto; font-size: 0.8rem;"><code>{% for line in lines %}{{ line }}{% endfor %}</code></pre>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
