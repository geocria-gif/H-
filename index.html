<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GestOper CPR-CN — Gestão Operacional</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2d333b;
  --txt:#e6edf3; --muted:#8b949e; --accent:#3b82f6; --accent2:#2563eb;
  --ok:#2ea043; --warn:#d29922; --err:#f85149;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Segoe UI,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{color:var(--muted);font-weight:600;background:var(--panel2);position:sticky;top:0}
tr:hover td{background:rgba(59,130,246,.07)}
.btn{display:inline-block;border:none;border-radius:6px;padding:6px 14px;background:var(--accent);color:#fff;text-decoration:none}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--err)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:10px}
.card h3{margin-bottom:8px;font-size:15px}
.muted{color:var(--muted);font-size:12px}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.center{text-align:center}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3b3f45;border-radius:6px}
/* Login */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#login-screen .box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px}
#login-screen h1{font-size:19px;margin-bottom:4px;text-align:center}
#login-screen p.sub{color:var(--muted);text-align:center;margin-bottom:20px;font-size:12px}
.login-field{margin-bottom:12px}
.login-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
/* Layout */
#app{display:flex;height:100vh;padding-top:0}
aside{width:225px;min-width:225px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px}
.nav-group{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px 3px}
.nav-item{padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--txt);display:flex;align-items:center;gap:8px}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item.sair{margin-top:auto;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:20px}
#view{max-width:1200px}
.pagehead{margin-bottom:16px}
.pagehead h2{font-size:20px}
.pagehead .sub{color:var(--muted);font-size:12px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .v{font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.bar-wrap{background:var(--panel2);border-radius:6px;height:16px;overflow:hidden}
.bar{background:var(--accent);height:100%}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=text],.toolbar input[type=date],.toolbar select{width:auto;max-width:260px}
.pager{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:1px 9px;font-size:11px}
.badge.alt{background:var(--ok)}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11px;margin:2px 2px 0 0}
.err{color:var(--err)}
.ok{color:var(--ok)}
.warn{color:var(--warn)}
.notice{padding:12px;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:13px}
#toast{position:fixed;bottom:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:#1c2330;border:1px solid var(--accent);color:var(--txt);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:340px}
.toast.err{border-color:var(--err)} .toast.ok{border-color:var(--ok)}
.searchbox{position:relative;max-width:420px}
.searchbox .results{position:absolute;top:calc(100%+4px);left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-height:280px;overflow:auto;z-index:20}
.searchbox .r-item{padding:8px 10px;cursor:pointer}
.searchbox .r-item:hover{background:rgba(59,130,246,.15)}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--txt);border-bottom-color:var(--accent)}
@media(max-width:820px){ #app{flex-direction:column;height:auto} aside{width:100%;flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto} nav{flex-direction:row;align-items:center;padding:0 8px} .nav-group{display:none} .brand{width:180px;white-space:nowrap} .nav-item{white-space:nowrap} main{padding:12px} }
</style>
</head>

<div id="login-screen" hidden>
  <div class="box">
    <h1>GestOper CPR-CN</h1>
    <p class="sub">Acesso restrito ao efetivo — dados no Firebase</p>
    <div id="login-err" class="err" style="color:#f85149;font-size:12px;margin-bottom:10px;display:none"></div>

      <div class="nav-item" data-page="dashboard" onclick="go('dashboard')">📊 Dashboard</div>

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const n=Number(v); return isFinite(n)?n:0; }
function fmt(n){ return num(n).toLocaleString('pt-BR'); }
function toast(msg,type){ const t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg; $('#toast').appendChild(t); setTimeout(()=>t.remove(),3500); }
function busy(html){ $('#view').innerHTML='<div class="notice">'+ (html||'Carregando…') +'</div>'; }

function calcCH(start,end){
  function toMin(s){ const p=s.split(':'); return (+p[0])*60+(+p[1]||0); }
  let a=toMin(start), b=toMin(end);
  if (!isFinite(a)||!isFinite(b)) return {d:0,n:0};
  if (b<=a) b+=1440;
  let d=0,n=0;
  for(let m=a;m<b;m++){ const hm=m%1440; if(hm>=300&&hm<1320) d++; else n++; }
  return {d:d/60,n:n/60};
}

/* ================= Firebase ================= */
let db=null, auth=null;
function initFirebase(){
  if(!FIREBASE_READY){ $('#login-hint').textContent='Configure o app web no Firebase (bloco FIREBASE_CONFIG no topo do index.html).'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  auth.onAuthStateChanged(user=>{
    if(user){
      $('#login-screen').hidden=true; $('#app').hidden=false;
      $('#user-label').textContent = user.email || user.uid;
      loadCaches().then(()=>go('dashboard')).catch(e=>toast('Erro: '+e.message,'err'));
    }else{
      $('#app').hidden=true;
      $('#login-hint').textContent='Use o e-mail e a senha criados no Firebase Authentication (console).';
    }
  });
}

async function doLogin(){
  const email=$('#login-email').value.trim(), pass=$('#login-pass').value;
  const err=$('#login-err');
  if(!email||!pass){ err.style.display='block'; err.textContent='Informe e-mail e senha.'; return; }
  err.style.display='none';
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ err.style.display='block'; err.textContent='Falha no login: '+(e.code||e.message); }
}
function logout(){ auth.signOut(); }

async function getDocs(q){
  const snap=await q.get();
  const out=[];
  snap.forEach(d=>{ const x=d.data(); x.__id=d.id; out.push(x); });
  return out;
}
function col(name){ return db.collection(name); }
function all(name){ return getDocs(col(name)); }
async function countDocs(collectionName, wheres){
  if(collectionName==='efetivopm' && C.efetivopm){
    let list=C.efetivopm;
    for(const [f,op,val] of (wheres||[])){
      if(op==='==') list=list.filter(d=>String(d[f])===String(val));
    }
    return list.length;
  }
  let q=db.collection(collectionName);
  for(const w of (wheres||[])) q=q.where(w[0],w[1],w[2]);
  const snap=await q.get();
  return snap.size;
}

/* ================= cache (coleções pequenas) ================= */
let C = { opms:[], cargos:[], municipios:[], legendas:[], valores:[], efetivopm:null };
async function loadCaches(){
  const [o,ca,mu,le,va,ef]=await Promise.all([
    all('opms'), all('cargos'), all('municipios'), all('escala_p2_legendas'), all('tabela_valores'),
    all('efetivopm')
  ]);
  C={opms:o,cargos:ca,municipios:mu,legendas:le,valores:va,efetivopm:ef};
}
function opmOf(id){ const o=C.opms.find(x=>String(x.opm_id)===String(id)); return o?o:null; }
function opmSigla(id){ const o=opmOf(id); return o?(o.opm_sigla||o.opm_desc||id):String(id); }
function cargoOf(id){ return C.cargos.find(x=>String(x.cargo_id)===String(id)); }
function cargoNome(id){ const c=cargoOf(id); return c?(c.posto_grad||c.cargo_id):(id?'??':'—'); }
function munNome(id){ const m=C.municipios.find(x=>String(x.id)===String(id)||x.nome===id); return m?m.nome:String(id||'—'); }

/* ================= navegação ================= */
const RENDER = {
  dashboard: renderDashboard, efetivo: renderEfetivo, opms: renderOPMs,
  municipios: renderMunicipios, eventos: renderEventos, viaturas: renderViaturas,
  escala: renderEscala, ocorrencias: renderOcorrencias
};
const PAGE_TITLE = {
  dashboard:'Dashboard', efetivo:'Efetivo PM', opms:'OPMs — Unidades',
  municipios:'Municípios', eventos:'Eventos', viaturas:'Viaturas',
  escala:'Escala de Horas', ocorrencias:'Ocorrências'
};
let currentPage='';
function go(page){
  currentPage=page;
  document.querySelectorAll('.nav-item[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
  const fn=RENDER[page];
  if(!fn){ $('#view').innerHTML='<div class="notice">Tela indisponível nesta versão.</div>'; return; }
  busy();
  fn().catch(e=>{ $('#view').innerHTML='<div class="notice err"><b>Erro ao carregar:</b> '+esc(e.message)+'</div>'; });
}

/* ================= Dashboard ================= */
async function renderDashboard(){
  const [ec,oc,mc,vc,carc,evc]=await Promise.all([
    countDocs('efetivopm'), countDocs('opms'), countDocs('municipios'),
    countDocs('viaturas'), countDocs('cargos'), countDocs('eventos')
  ]);
  const eventos=await all('eventos'); eventos.sort((a,b)=>(b.evento_dta_inicio||'').localeCompare(a.evento_dta_inicio||''));
  const oe=await all('opm_eventos');
  const porEvento = {};
  for(const ev of eventos){ porEvento[ev.evento_id]= {oe:[], escalados:0}; }
  for(const r of oe){ if(porEvento[r.evento_id]) porEvento[r.evento_id].oe.push(r); }
  for(const ev of eventos){
    const oes=porEvento[ev.evento_id].oe;
    for(const r of oes){ porEvento[ev.evento_id].escalados += await countDocs('escalas',[['opm_evento_id','==',num(r.opm_evento_id)]]); }
  }
  const ativos = C.opms.filter(o=>o.opm_atv!=='FIM').length;
  let cards = `
    <div class="pagehead"><h2>Dashboard</h2><div class="sub">Visão geral do efetivo, unidades e eventos — dados do Firestore</div></div>
    <div class="stat-row mb">
      <div class="stat"><div class="v">${fmt(ec)}</div><div class="l">Efetivo PM</div></div>
      <div class="stat"><div class="v">${oc}</div><div class="l">OPMs (${ativos} ativas)</div></div>
      <div class="stat"><div class="v">${fmt(carc)}</div><div class="l">Cargos/Postos</div></div>
      <div class="stat"><div class="v">${fmt(mc)}</div><div class="l">Municípios</div></div>
      <div class="stat"><div class="v">${fmt(vc)}</div><div class="l">Viaturas</div></div>
      <div class="stat"><div class="v">${evc}</div><div class="l">Eventos</div></div>
    </div>`;
  if(eventos.length){
    cards += `<div class="card"><h3>Policiais Escalados por Evento</h3>
      <table><thead><tr><th>Evento</th><th>Início</th><th>Fim</th><th>Tipo</th><th>OPMs</th><th>Escalados</th></tr></thead><tbody>`;
    for(const ev of eventos){
      const p=porEvento[ev.evento_id];
      cards += `<tr><td>${esc(ev.evento_desc||ev.evento_nome||'')}</td>
        <td class="muted">${esc(ev.evento_dta_inicio||'—')}</td><td class="muted">${esc(ev.evento_dta_fim||'—')}</td>
        <td>${esc(ev.tipo_pagamento||'')}</td>
        <td>${p.oe.map(x=>'<span class="pill">'+esc(opmSigla(x.opm_id))+'</span>').join('')}</td>
        <td><b>${p.escalados}</b></td></tr>`;
    }
    cards += `</tbody></table></div>`;
  }
  $('#view').innerHTML=cards;
}

/* ================= Efetivo PM ================= */
const EF = { term:'', stack:[], nextLast:null, page:0 };
async function renderEfetivo(){
  EF.term=$('#ef-term')?$('#ef-term').value.trim():EF.term;
  const term=EF.term;
  let q;
  if(term){
    if(/^\d{3,}$/.test(term)){ q=col('efetivopm').orderBy('matricula').startAt(term).endAt(term+'\uf8ff'); }
    else { q=col('efetivopm').orderBy('nome').startAt(term).endAt(term+'\uf8ff'); }
  }else{ q=col('efetivopm').orderBy('matricula'); }
  q=q.limit(20);
  if(EF.nextLast) q=q.startAfter(EF.nextLast);
  const items=await getDocs(q);
  EF.nextLast = items.length ? col('efetivopm').doc(items[items.length-1].__id) : EF.nextLast;
  EF.page = term ? 0 : EF.nextLast? 1 : 0;
  if(term){ EF.stack=[]; }
  let html=`<div class="pagehead"><h2>Efetivo PM</h2><div class="sub">Lista paginada direto do Firestore (30.5 mil militares)</div></div>
    <div class="toolbar">
      <div class="searchbox"><input id="ef-term" type="text" placeholder="Buscar por nome ou matrícula…" value="${esc(term)}" onkeydown="if(event.key==='Enter')go('efetivo')" />
      </div>
      <button class="btn ghost" onclick="efSetTerm('')">Limpar</button>
    </div>
    <div class="card" style="padding:0;overflow:auto"><table>
    <thead><tr><th>Matrícula</th><th>Nome</th><th>Posto/Grad</th><th>OPM</th><th>Situação</th><th>Telefone</th></tr></thead><tbody>`;
  if(!items.length) html+=`<tr><td colspan="6" class="center muted">Nada encontrado.</td></tr>`;
  for(const it of items){
    html+=`<tr><td>${esc(it.matricula)}</td><td>${esc(it.nome)}</td><td>${esc(cargoNome(it.cargo))}</td>
      <td>${esc(opmSigla(it.opm_id))}</td>
      <td><span class="pill ${String(it.sit||'').toUpperCase()==='AT'?'alt':''}">${esc(it.sit||'—')}</span></td>
      <td>${esc(it.telefone||'—')}</td></tr>`;
  }
  html+=`</tbody></table></div>`;
  html+=`<div class="pager">
    <button class="btn ghost sm" onclick="efPrev()" ${EF.stack.length?'':'disabled'}>◀ Anterior</button>
    <button class="btn ghost sm" onclick="efNext()" ${items.length<20?'disabled':''}>Próxima ▶</button>
    <span>${term?'Busca':EF.page?'Página '+EF.page:'Início'}</span>
  </div>`;
  $('#view').innerHTML=html;
  document.getElementById('ef-term')?.focus();
}
function efSetTerm(t){ EF.term=t; EF.stack=[]; EF.nextLast=null; go('efetivo'); }
function efNext(){
  if(EF.nextLast){ EF.stack.push(EF.nextLast); EF.nextLast=null; go('efetivo'); }
}
function efPrev(){ EF.nextLast=EF.stack.pop()||null; go('efetivo'); }

/* ================= OPMs ================= */
async function renderOPMs(){
  const rows=[];
  for(const o of C.opms){
    const n=await countDocs('efetivopm',[['opm_id','==',String(o.opm_id)]]);
    rows.push([o,n]);
  }
  rows.sort((a,b)=>(a[0].opm_sigla||'').localeCompare(b[0].opm_sigla||''));
  let html=`<div class="pagehead"><h2>OPMs — Unidades</h2><div class="sub">Unidades com efetivo vinculado (contagens agregadas)</div></div>
    <div class="card" style="padding:0;overflow:auto"><table>
    <thead><tr><th>Sigla</th><th>Descrição</th><th>Município</th><th>Comandante</th><th>Efetivo</th></tr></thead><tbody>`;
  for(const [o,n] of rows){
    html+=`<tr><td><b>${esc(o.opm_sigla||o.opm_id)}</b></td><td>${esc(o.opm_desc||'')}</td>
      <td>${esc(o.opm_municipio||'—')}</td><td>${esc(o.comandante||'—')}</td><td><b>${fmt(n)}</b></td></tr>`;
  }
  html+=`</tbody></table></div>`;
  $('#view').innerHTML=html;
}

/* ================= Municípios ================= */
async function renderMunicipios(){
  const ms=[...C.municipios].sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  let html=`<div class="pagehead"><h2>Municípios</h2><div class="sub">${ms.length} municípios cadastrados</div></div>
    <div class="card" style="padding:0;overflow:auto"><table>
    <thead><tr><th>Nome</th><th>UF</th><th>Região</th><th>População</th><th>Dist. Irecê (km)</th><th>Prefeito</th><th>Partido</th></tr></thead><tbody>`;
  for(const m of ms){
    html+=`<tr><td>${esc(m.nome)}</td><td>${esc(m.uf||'')}</td><td>${esc(m.regiao||'—')}</td>
      <td>${m.populacao?fmt(m.populacao):'—'}</td><td>${m.dist_irece!=null?num(m.dist_irece).toFixed(1):'—'}</td>
      <td>${esc(m.prefeito||'—')}</td><td>${esc(m.partido||'—')}</td></tr>`;
  }
  html+=`</tbody></table></div>`;
  $('#view').innerHTML=html;
}

/* ================= Eventos ================= */
async function renderEventos(){
  const eventos=await all('eventos'); eventos.sort((a,b)=>(b.evento_dta_inicio||'').localeCompare(a.evento_dta_inicio||''));
  const oe=await all('opm_eventos');
  const byEvento={};
  for(const r of oe){ (byEvento[r.evento_id]=byEvento[r.evento_id]||[]).push(r); }
  const counts={};
  for(const r of oe){ counts[r.opm_evento_id]=num(r.opm_evento_id); }
  let html=`<div class="pagehead"><h2>Eventos</h2><div class="sub">Eventos com OPMs alocadas e policiais escalados</div></div>`;
  for(const ev of eventos){
    const oes=byEvento[ev.evento_id]||[];
    let escal=0;
    for(const r of oes) escal+=await countDocs('escalas',[['opm_evento_id','==',num(r.opm_evento_id)]]);
    html+=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><h3 style="margin:0">${esc(ev.evento_desc||ev.evento_nome||'')} <span class="badge">${esc(ev.evento_id)}</span></h3>
      <div class="muted mt">${esc(ev.evento_dta_inicio||'—')} → ${esc(ev.evento_dta_fim||'—')} · ${esc(ev.tipo_pagamento||'')}</div></div>
      <div class="muted">${oes.length} OPM(s) · <b>${escal}</b> policial(is) escalado(s)</div></div>
      <div class="mt">${oes.map(r=>'<span class="pill">'+esc(opmSigla(r.opm_id))+'</span>').join('')||'<span class="muted">Sem OPM alocada.</span>'}</div></div>`;
  }
  if(!eventos.length) html+=`<div class="notice">Nenhum evento cadastrado.</div>`;
  $('#view').innerHTML=html;
}

/* ================= Viaturas ================= */
const VF = { last:null };
async function renderViaturas(){
  let q=col('viaturas').orderBy('prefixo').limit(20);
  if(VF.last) q=q.startAfter(VF.last);
  const items=await getDocs(q);
  VF.last=items.length?col('viaturas').doc(items[items.length-1].__id):VF.last;
  let html=`<div class="pagehead"><h2>Viaturas</h2><div class="sub">Página ${VF.last?'>1':1} · ordem por prefixo</div></div>
    <div class="card" style="padding:0;overflow:auto"><table>
    <thead><tr><th>Prefixo</th><th>Placa</th><th>Marca/Modelo</th><th>Município</th><th>Unidade</th><th>Situação</th></tr></thead><tbody>`;
  if(!items.length) html+=`<tr><td colspan="6" class="center muted">Vazio.</td></tr>`;
  for(const v of items){
    html+=`<tr><td><b>${esc(v.prefixo)}</b></td><td>${esc(v.placa||'—')}</td>
      <td>${esc((v.marca||'')+' '+(v.modelo||''))||'—'}</td>
      <td>${esc(v.municipio||'—')}</td><td>${esc(v.unidade||'—')}</td>
      <td><span class="pill ${String(v.situacao||'').toUpperCase()==='ATIVA'?'alt':''}">${esc(v.situacao||'—')}</span></td></tr>`;
  }
  html+=`</tbody></table></div>
    <div class="pager"><button class="btn ghost sm" onclick="vfPrev()">◀ Página anterior</button>
    <button class="btn ghost sm" onclick="vfNext()" ${items.length<20?'disabled':''}>Próxima ▶</button></div>`;
  $('#view').innerHTML=html;
  VF.reset=vfPrev;
}
let VSTACK=[];
function vfNext(){ VSTACK.push(VF.last||null); VF.last=null; go('viaturas'); }
function vfPrev(){ VF.last=VSTACK.pop()||null; go('viaturas'); }

/* ================= Escala de Horas ================= */
const ES = { eventoId:null, opmEventoId:null, data:'' };
function escalaReset(){ ES.eventoId=null; ES.opmEventoId=null; ES.data=todayStr(); go('escala'); }
async function renderEscala(){
  if(!ES.eventoId){ return renderEscalaPickEvento(); }
  if(!ES.opmEventoId){ return renderEscalaPickOpm(); }
  return renderEscalaGrid();
}

async function renderEscalaPickEvento(){
  const eventos=await all('eventos'); eventos.sort((a,b)=>(b.evento_dta_inicio||'').localeCompare(a.evento_dta_inicio||''));
  let html=`<div class="pagehead"><h2>Escala de Horas</h2><div class="sub">1️⃣ Selecione o evento para lançar as horas dos policiais</div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">`;
  if(!eventos.length) html+=`<div class="notice">Nenhum evento cadastrado.</div>`;
  for(const ev of eventos){
    html+=`<button class="card" style="text-align:left;border-color:var(--line)" onclick="esSetEvento(${num(ev.evento_id)})">
      <h3 style="margin:0">${esc(ev.evento_desc||ev.evento_nome||'')}</h3>
      <div class="muted mt">${esc(ev.evento_dta_inicio||'—')} → ${esc(ev.evento_dta_fim||'—')} · ${esc(ev.tipo_pagamento||'')}</div></button>`;
  }
  html+=`</div>`;
  $('#view').innerHTML=html;
}
function esSetEvento(id){ ES.eventoId=num(id); ES.opmEventoId=null; ES.data=todayStr(); go('escala'); }

async function renderEscalaPickOpm(){
  const evRow=(await getDocs(col('eventos').where('evento_id','==',ES.eventoId)))[0];
  const evName=evRow?(evRow.evento_desc||evRow.evento_nome||''):'';
  const oes=(await all('opm_eventos')).filter(r=>num(r.evento_id)===ES.eventoId);
  const counts={};
  for(const r of oes){ counts[r.opm_evento_id]=await countDocs('escalas',[['opm_evento_id','==',num(r.opm_evento_id)]]); }
  let html=`<div class="pagehead"><h2>Escala de Horas</h2>
    <div class="sub">Evento: <b>${esc(evName)}</b> · 2️⃣ Escolha a OPM
    <button class="btn ghost sm" style="margin-left:8px" onclick="escalaReset()">↩ Trocar evento</button></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">`;
  if(!oes.length) html+=`<div class="notice">Sem OPMs alocadas para este evento.</div>`;
  for(const r of oes){
    const o=opmOf(r.opm_id);
    html+=`<div class="card"><h3 style="margin:0">${esc(o?o.opm_sigla:r.opm_id)}</h3>
      <div class="muted mt">${esc(o?o.opm_desc:'')} · ${esc(o?o.opm_municipio:'')}</div>
      <div class="mt">${counts[r.opm_evento_id]||0} policial(is) lançado(s)</div>
      <button class="btn sm mt" onclick="esSetOpm(${num(r.opm_evento_id)})">Abrir escala</button></div>`;
  }
  html+=`</div>`;
  $('#view').innerHTML=html;
}
function esSetOpm(id){ ES.opmEventoId=num(id); if(!ES.data) ES.data=todayStr(); go('escala'); }

async function renderEscalaGrid(){
  const oes=(await all('opm_eventos'));
  const oe=oes.find(r=>num(r.opm_evento_id)===ES.opmEventoId);
  const o=oe?opmOf(oe.opm_id):null;
  const ev=oe?(await getDocs(col('eventos').where('evento_id','==',num(oe.evento_id))))[0]:null;
  const data=ES.data||todayStr();
  const allRows=await getDocs(col('escalas').where('escala_data','==',data));
  const rows=allRows.filter(r=>num(r.opm_evento_id)===ES.opmEventoId);
  const seen={};
  const list=[];
  for(const r of rows){
    if(seen[r.matricula]===undefined) seen[r.matricula]=[];
    seen[r.matricula].push(r);
  }
  for(const k of Object.keys(seen)){
    const arr=seen[k].sort((a,b)=>(a.__id===`${ES.opmEventoId}_${k}_${data}`)?-1:0);
    list.push(arr[0]);
  }
  list.sort((a,b)=>(a.hora_inicio||'99').localeCompare(b.hora_inicio||'99'));
  let td=0,tn=0;
  for(const r of list){ td+=num(r.escala_ch_diurna); tn+=num(r.escala_ch_noturna); }
  let html=`<div class="pagehead"><h2>Escala de Horas — ${esc(ev?(ev.evento_desc||ev.evento_nome||''):'')}</h2>
    <div class="sub">OPM: <b>${esc(o?(o.opm_sigla||o.opm_desc):'')}</b> · ${data}
    · Diurna <b>${td}</b>h · Noturna <b>${tn}</b>h</div></div>
    <div class="toolbar">
      <input type="date" id="es-data" value="${data}" onchange="esSetData(this.value)" />
      <button class="btn ghost" onclick="ES.opmEventoId=null;go('escala')">↩ Trocar OPM</button>
      <button class="btn ghost" onclick="escalaReset()">↩ Trocar evento</button>
    </div>
    <div class="card"><h3>➕ Lançar horas</h3>
      <div class="grid" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end">
        <div><label class="muted">Militar (busca por nome ou matrícula)</label>
          <div class="searchbox"><input id="es-busca" type="text" placeholder="digite e tecle Enter…" onkeydown="if(event.key==='Enter')esBuscar(this.value)" />
          <div class="results" id="es-res" hidden></div></div>
          <input type="hidden" id="es-mat" /></div>
        <div><label class="muted">Início</label><input id="es-hi" type="time" value="07:00" /></div>
        <div><label class="muted">Fim</label><input id="es-hf" type="time" value="19:00" /></div>
        <div><label class="muted">Tipo</label><select id="es-tipo"><option value="HE">HE</option><option value="VD">VD</option><option value="SO">SO</option></select></div>
        <div><label class="muted">Autocalc</label><div id="es-calc" class="muted">D 12h · N 0h</div></div>
        <div><button class="btn" onclick="esSalvar()">Salvar</button></div>
      </div>
    </div>`;
  html+=`<div class="card" style="padding:0;overflow:auto"><table>
    <thead><tr><th>Matrícula</th><th>Nome</th><th>Início</th><th>Fim</th><th>D</th><th>N</th><th>Tipo</th><th></th></tr></thead><tbody>`;
  if(!list.length) html+=`<tr><td colspan="8" class="center muted">Nenhum lançamento nesta data.</td></tr>`;
  for(const r of list){
    html+=`<tr><td>${esc(r.matricula)}</td>
      <td>${esc(r.nome||'')} <span class="muted">${esc(r.telefone||'')}</span></td>
      <td>${esc(r.hora_inicio||'—')}</td><td>${esc(r.hora_fim||'—')}</td>
      <td>${num(r.escala_ch_diurna)}</td><td>${num(r.escala_ch_noturna)}</td>
      <td>${esc(r.tipo_pagamento||'HE')}</td>
      <td><button class="btn danger sm" onclick="esRemover('${esc(r.__id)}')">✕</button></td></tr>`;
  }
  html+=`</tbody></table></div>`;
  $('#view').innerHTML=html;
  const hi=$('#es-hi'), hf=$('#es-hf');
  [hi,hf].forEach(inp=>inp.addEventListener('change',esCalcPreview));
  esCalcPreview();
}
function esSetData(d){ ES.data=d; go('escala'); }

async function esBuscar(termRaw){
  const t=(termRaw||'').trim(); const box=$('#es-res');
  if(!t){ box.hidden=true; return; }
  let found=[];
  const t2=t.replace(/\D/g,'');
  if(t2.length>=4){
    const m=await getDocs(col('efetivopm').orderBy('matricula').startAt(t2).endAt(t2+'\uf8ff').limit(12));
    found=found.concat(m);
  }
  const n=await getDocs(col('efetivopm').orderBy('nome').startAt(t).endAt(t+'\uf8ff').limit(12));
  const seenm={};
  const merged=[];
  for(const x of n){ if(!seenm[x.matricula]){ seenm[x.matricula]=1; merged.push(x); } }
  for(const x of found){ if(!seenm[x.matricula]){ seenm[x.matricula]=1; merged.push(x); } }
  box.hidden=false;
  box.innerHTML=merged.slice(0,12).map(x=>`<div class="r-item" onclick="esPick('${esc(x.matricula)}','${esc(String(x.nome).replace(/'/g,"\\'"))}')"><b>${esc(x.matricula)}</b> — ${esc(x.nome)} <span class="muted">${esc(cargoNome(x.cargo))}</span></div>`).join('')||'<div class="r-item muted">Nada encontrado.</div>';
}
function esPick(mat,nome){
  $('#es-mat').value=mat;
  const b=$('#es-busca'); b.value=''; $('#es-res').hidden=true;
  b.placeholder=mat+' — '+nome;
  toast('Militar selecionado: '+nome,'ok');
}
function esCalcPreview(){
  const hi=$('#es-hi')?$('#es-hi').value:'07:00', hf=$('#es-hf')?$('#es-hf').value:'19:00';
  const r=calcCH(hi,hf);
  $('#es-calc').textContent='D '+r.d+'h · N '+r.n+'h';
}
async function esSalvar(){
  const mat=$('#es-mat').value.trim();
  const hi=$('#es-hi').value, hf=$('#es-hf').value;
  const tipo=$('#es-tipo').value;
  if(!mat){ toast('Busque e selecione o militar.','err'); return; }
  if(!hi||!hf){ toast('Informe hora início e fim.','err'); return; }
  const c=calcCH(hi,hf);
  const data=ES.data||todayStr();
  const docId=`${ES.opmEventoId}_${mat}_${data}`;
  const per=(await getDocs(col('efetivopm').where('matricula','==',String(mat)).limit(1)))[0];
  await col('escalas').doc(docId).set({
    opm_evento_id: ES.opmEventoId, matricula: String(mat), escala_data: data,
    hora_inicio: hi, hora_fim: hf,
    escala_ch_diurna: c.d, escala_ch_noturna: c.n, tipo_pagamento: tipo,
    nome: per?per.nome:'', telefone: per?per.telefone||'':''
  }, {merge:true});
  toast('Lançamento salvo no Firestore.','ok');
  go('escala');
}
async function esRemover(docId){
  if(!confirm('Remover este lançamento?')) return;
  await col('escalas').doc(docId).delete();
  toast('Lançamento removido.');
  go('escala');
}

/* ================= Ocorrências ================= */
const OC = { tab:'ind' };
async function renderOcorrencias(){
  if(OC.tab==='nova') return renderOcorrenciaNova();
  const eventos=await all('ocorrencia_eventos');
  const datas=[...new Set(eventos.map(r=>r.data_ref))].sort().reverse();
  OC.datas = OC.datas || datas[0] || todayStr();
  const rows=eventos.filter(r=>r.data_ref===OC.datas).sort((a,b)=>(a.ordem_grupo||b.ordem_grupo||0)-(b.ordem_grupo||a.ordem_grupo||0)||''.localeCompare(a.grupo+String(a.metrica)) );
  let html=`<div class="pagehead"><h2>Ocorrências em Eventos</h2><div class="sub">Matriz de indicadores por data</div></div>
    <div class="tabs">
      <div class="tab ${OC.tab==='ind'?'active':''}" onclick="ocTab('ind')">📊 Indicadores</div>
      <div class="tab ${OC.tab==='nova'?'active':''}" onclick="ocTab('nova')">🆕 Registrar ocorrência</div>
    </div>
    <div class="toolbar"><input type="date" id="oc-data" value="${esc(OC.datas)}" onchange="ocData(this.value)" /></div>`;
  if(!rows.length){ html+=`<div class="notice">Sem indicadores para ${esc(OC.datas)}.</div>`; }
  else{
    const total=rows.reduce((s,r)=>s+num(r.valor),0);
    html+=`<div class="card"><div class="stat-row"><div class="stat"><div class="v">${fmt(total)}</div><div class="l">Total no dia</div></div></div></div>
    <div class="card" style="padding:0;overflow:auto"><table>
    <thead><tr><th>Grupo</th><th>Métrica</th><th>Valor</th></tr></thead><tbody>`;
    for(const r of rows){
      html+=`<tr><td>${esc(r.grupo)}</td><td>${esc(r.metrica)}</td><td>${fmt(r.valor)}</td></tr>`;
    }
    html+=`</tbody></table></div>`;
  }
  $('#view').innerHTML=html;
}
function ocTab(t){ OC.tab=t; go('ocorrencias'); }
function ocData(d){ OC.datas=d; go('ocorrencias'); }

async function renderOcorrenciaNova(){
  let html=`<div class="pagehead"><h2>Registrar Ocorrência</h2><div class="sub">Novo registro direto no Firestore</div></div>
    <div class="tabs">
      <div class="tab ${OC.tab==='ind'?'active':''}" onclick="ocTab('ind')">📊 Indicadores</div>
      <div class="tab ${OC.tab==='nova'?'active':''}" onclick="ocTab('nova')">🆕 Registrar ocorrência</div>
    </div>
    <div class="card"><div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
      <div><label class="muted">Tipo de Ocorrência *</label>
        <select id="oc-tipo">${['Homicídio','Feminicídio','Tentativa de Homicídio','Latrocínio','Estupro','Estupro de Vulnerável','Violência Doméstica','Lesão Corporal','Roubo','Roubo a Banco','Roubo de Veículo','Furto','Furto de Veículo','Tráfico de Drogas','Porte de Drogas','Porte Ilegal de Arma','Sequestro','Extorsão','Dano ao Patrimônio','Ameaça','Direção Perigosa','Perturbação do Sossego','Receptação','Estelionato','Desaparecimento de Pessoa','Suicídio / Tentativa','Incêndio Criminoso','Violação de Domicílio','Atentado ao Pudor','Corrupção de Menores','Crime Cibernético','Acidente de Trânsito','Atropelamento','Achado de Cadáver','Outros'].map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div><label class="muted">Data e Hora *</label><input id="oc-dh" type="datetime-local" value="${todayStr().replace(/-/g,'-')}T00:00" /></div>
      <div><label class="muted">Cidade</label>
        <select id="oc-cid"><option value="">—</option>${C.municipios.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).map(m=>`<option value="${esc(m.nome)}">${esc(m.nome)}</option>`).join('')}</select></div>
      <div><label class="muted">VTR que atendeu</label><input id="oc-vtr" type="text" placeholder="ex: 33415" /></div>
      <div style="grid-column:1/-1"><label class="muted">Descrição dos Fatos</label><textarea id="oc-desc" rows="4"></textarea></div>
      <div style="grid-column:1/-1"><label class="muted">Dados Relevantes</label><textarea id="oc-dados" rows="2"></textarea></div>
    </div><button class="btn mt" onclick="ocSalvar()">💾 Salvar ocorrência</button></div>`;
  $('#view').innerHTML=html;
}

async function ocSalvar(){
  const tipo=$('#oc-tipo').value, dh=$('#oc-dh').value;
  const cid=$('#oc-cid').value, vtr=$('#oc-vtr').value.trim();
  const desc=$('#oc-desc').value.trim(), dados=$('#oc-dados').value.trim();
  if(!tipo||!dh){ toast('Informe tipo e data/hora.','err'); return; }
  const ra=dh.replace('T',' '); let dataISO=ra+':00';
  if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(ra)) dataISO=ra.replace(' ','T')+':00';
  const max=(await getDocs(col('ocorrencias').orderBy('id','desc').limit(1)))[0];
  const next=(max&&num(max.id))?num(max.id)+1:1;
  const payload={ id:next, tipo, data_hora:dataISO, cidade:cid||'', vtr, descricao:desc, dados_relevantes:dados };
  await col('ocorrencias').doc(String(next)).set(payload);
  toast('Ocorrência #'+next+' salva no Firestore.','ok');
  OC.tab='ind'; go('ocorrencias');
}

/* ================= boot ================= */
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initFirebase);
else initFirebase();
</script>
